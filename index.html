<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Pick Fruit</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="screen">
      <h1>Pick Fruit</h1>
      <button class="btn" id="start-btn">Play Game</button>
    </div>

    <div class="screen">
      <h1>What is your favorite fruit?</h1>
      <ul class="fruit-list">
        <li>
          <button class="choose-fruit-btn">
            <p>Apple</p>
            <img src="img/apple.png" alt="apple">
          </button>
        </li>
        <li>
          <button class="choose-fruit-btn">
            <p>Banana</p>
            <img src="img/banana.png" alt="banana">
          </button>
        </li>
        <li>
          <button class="choose-fruit-btn">
            <p>Grapes</p>
            <img src="img/grape.png" alt="grapes">
          </button>
        </li>
        <li>  
        <button class="choose-fruit-btn">
            <p>Lemon</p>
            <img src="img/lemon.png" alt="lemon">
          </button>
        </li>
        <li>
          <button class="choose-fruit-btn">
            <p>Lime</p>
            <img src="img/lime.png" alt="lime">
          </button>
        </li>
        <li>
          <button class="choose-fruit-btn">
            <p>Strawberry</p>
            <img src="img/strawberry.png" alt="strawberry">
          </button>
        </li>
      </ul>
    </div>

    <div class="screen game-container" id="game-container">
      <h3 id="time" class="time">Time: 00:00</h3>
      <h3 id="score" class="score">Score: 0</h3>
      <h5 id="message1" class="message">
        Pick all the fruit! <br>
        I nned 25 to share with all my friends!
      </h5>
      <h5 id="message2" class="message">
        Great job! <br>
        You picked all 25 fruit!
      </h5>
    </div>
  </body>
</html>
